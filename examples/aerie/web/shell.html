<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrelcraft</title>
<style>
  /* The game fills the whole window; the page itself never scrolls. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2a2236; }
  body { font: 14px system-ui, sans-serif; color: #eee; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
  const status = document.getElementById('status');
  if (!navigator.gpu) {
    status.textContent = 'Kestrelcraft needs a browser with WebGPU (for example a recent Chrome).';
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    // Saves live in IndexedDB: mount it before main runs, and load what's
    // there. The game flushes it after each save.
    preRun: [() => {
      FS.mkdir('/saves');
      FS.mount(IDBFS, {}, '/saves');
      addRunDependency('saves');
      FS.syncfs(true, (err) => {
        if (err) console.error('loading saves failed', err);
        removeRunDependency('saves');
      });
    }],
    onRuntimeInitialized: () => { status.textContent = ''; Module.canvas.focus(); },
    print: (text) => console.log(text),
    printErr: (text) => console.error(text),
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
