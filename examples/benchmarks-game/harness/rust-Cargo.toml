[package]
name = "bg"
version = "0.1.0"
edition = "2018"

[dependencies]
rayon = "1"
regex = "1"
futures = "0.1"
futures-cpupool = "0.1"
numeric-array = "0.5"
generic-array = "0.14"
num-traits = "0.2"
num_cpus = "1"
typed-arena = "2"
toolshed = "0.8"
num = "0.4"
itertools = "0.10"
indexmap = "1"
hashbrown = "0.14"
tokio-threadpool = "0.1"
crossbeam-utils = "0.8"
fnv = "1"
fxhash = "0.2"
pcre2-sys = "0.2"
scoped_threadpool = "0.1"
libc = "0.2"
spin = "0.5"
memchr = "2"
rug = { version = "1", default-features = false, features = ["integer"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
